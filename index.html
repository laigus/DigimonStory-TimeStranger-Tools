<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>--</title>
    <!-- 可爱字体（在线 & 本地） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=WDXL+Lubrifont+SC&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>--</h1>
        <div class="settings-wrapper">
            <div class="font-selector-wrapper">
                <label for="fontSelector">字体</label>
                <select id="fontSelector">
                    <option value="default">默认(微软雅黑)</option>
                    <option value="kuai">站酷快乐体</option>
                    <option value="xiaowei">站酷小微体</option>
                    <option value="mashan">马善政手写体</option>
                    <option value="longcang">龙藏体</option>
                    <option value="lubrifont">WDXL润滑体</option>
                    <!-- <option value="yuanyuan">圆圆</option>
                    <option value="fangfang">方方</option> -->
                </select>
            </div>
            <div class="theme-selector-wrapper">
                <label for="themeSelector">材质</label>
                <select id="themeSelector">
                    <option value="default">默认</option>
                    <option value="glass">磨砂玻璃</option>
                    <option value="crystal">水晶玻璃</option>
                </select>
            </div>
            <div class="color-selector-wrapper">
                <label for="colorSelector">配色</label>
                <select id="colorSelector">
                    <option value="purple">紫色梦幻</option>
                    <option value="ocean">海洋蓝</option>
                    <option value="sunset">日落橙</option>
                    <option value="forest">森林绿</option>
                    <option value="rose">玫瑰粉</option>
                    <option value="night">暗夜黑</option>
                </select>
            </div>
        </div>
        
        <div class="main-content">
            <!-- 左侧数码宝贝列表 -->
            <div class="digimon-list">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="搜索数码宝贝（支持中文/拼音首字母）">
                </div>
                <div class="list-container" id="digimonListContainer">
                    <!-- 数码宝贝列表将在这里动态生成 -->
                </div>
            </div>
            
            <!-- 右侧进化路线图 -->
            <div class="evolution-chart">
                <!-- 标签页导航 -->
                <div class="tab-navigation">
                    <button class="tab-button active" data-tab="evolution">进化</button>
                    <button class="tab-button" data-tab="route">路线</button>
                    <button class="tab-button" data-tab="training-advanced">训练</button>
                    <button class="tab-button" data-tab="personality">个性</button>
                    <button class="tab-button" data-tab="notes">备注</button>
                </div>
                
                <!-- 标签页内容 -->
                <div class="tab-content">
                    <!-- 进化标签页 -->
                    <div class="tab-pane active" id="evolution-tab">
                        <div class="chart-container" id="evolutionChart">
                            <div class="no-selection">
                                <h3>请选择一个数码宝贝查看进化路线</h3>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 路线标签页 -->
                    <div class="tab-pane" id="route-tab">
                        <div class="route-container" id="routePlannerRoot"></div>
                    </div>

                    <!-- 训练标签页 -->
                    <div class="tab-pane" id="training-advanced-tab">
                        <div class="training2-container" id="training2Container"></div>
                    </div>

                    <!-- 个性标签页 -->
                    <div class="tab-pane" id="personality-tab">
                        <div class="personality-container">
                            <div id="personalityChart" class="personality-chart-root"></div>
                        </div>
                    </div>

                    <!-- 备注标签页 -->
                    <div class="tab-pane" id="notes-tab">
                        <div class="notes-container">
                            <p class="notes-hint">内容保存至浏览器缓存中，清除缓存会导致备注内容丢失</p>
                            <div class="notes-editor">
                                <textarea id="notesTextarea" class="notes-textarea" data-max-height="400" placeholder="在这里记录你的想法、组合心得或其他备忘..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/digimon-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tab-manager.js"></script>
    <script src="js/digimon-list.js"></script>
    <script src="js/evolution-chart.js"></script>
    <script src="js/evolutionroute-planner.js"></script>
    <script src="js/training2-manager.js"></script>
    <script src="js/personnality-chart.js"></script>
    <script src="js/notes-manager.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
